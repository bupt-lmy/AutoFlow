agent:
  id: agent-requirement-reviewer
  name: "需求审核 Agent"
  role: |
    你是 AxonFlow 自优化工作流的质量门禁与 Supervisor。
    审核产品任务的证据、价值、范围、安全性和可测试性；审核编码结果是否有变更与测试证据；
    审核验收结果是否逐项记录。可以批准、要求产品重提、让 Codex 返工或结束工作流。
    不得因为传输层 status=success 就跳过业务证据审查。
  agent_type: base
  model:
    provider: minimax
    name: MiniMax-M3
    temperature: 0
    max_tokens: 4096
    timeout: 90.0
    api_base: "https://api.minimaxi.com/v1"
    credential_id: cred-e29c18f8584a
    fallback_models: []
  tags:
    - supervisor
    - requirement-review
    - quality-gate
  tools: []
  skills:
    - requirement-gate
  retry_limit: 2
  max_concurrent: 1
  memory:
    enabled: true
    backend: in_memory
    max_records: 500
    scopes:
      - workflow
  parameters:
    model_profile_id: model-c21da460777e

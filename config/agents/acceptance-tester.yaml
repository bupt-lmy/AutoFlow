agent:
  id: agent-acceptance-tester
  name: "浏览器验收 Agent"
  role: |
    你负责根据上游需求、验收标准和 Codex 变更证据执行最终验收。
    必须运行相关自动化测试；涉及 UI 时必须使用 browser-acceptance Skill 的真实浏览器脚本查看渲染与交互效果。
    使用中文生成详细的优化归档，将产品提案、审核理由、实现文件与目的、每个需求的验证步骤、预期与实际结果、命令输出摘要、浏览器操作与截图、失败原因、返工建议和残余风险追加到优化日志。
    命令、路径、URL、ID 和原始错误可保留原文；没有证据的内容必须标记“未提供”或“未验证”，不得编造。
    只有全部需求都有直接证据、全部通过且日志保存后才能返回 passed。
    最终只返回 Skill 规定的 JSON 对象。
  agent_type: custom
  class_path: axonflow.agents.structured.StructuredResultAgent
  model:
    provider: minimax
    name: MiniMax-M3
    temperature: 0.1
    max_tokens: 6144
    timeout: 120.0
    api_base: "https://api.minimaxi.com/v1"
    credential_id: cred-e29c18f8584a
    fallback_models: []
  tags:
    - testing
    - browser
    - acceptance
    - reporting
  tools:
    - directory_tree
    - text_search
    - file_read
    - file_write
    - shell_exec
    - http_request
  skills:
    - browser-acceptance
  retry_limit: 1
  max_concurrent: 1
  memory:
    enabled: true
    backend: in_memory
    max_records: 500
    scopes:
      - agent
      - workflow
  parameters:
    model_profile_id: model-c21da460777e
    max_tool_rounds: 20
    structured_result:
      strict: true
      verdict_field: verdict
      success_values:
        - passed
      error_values:
        - failed
        - blocked
      promote_fields:
        - summary
        - requirements
        - commands
        - browser_checks
        - report_path
        - failures

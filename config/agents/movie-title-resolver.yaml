agent:
  id: agent-movie-title-resolver
  name: "影视名称解析器"
  role: "将用户输入的中文、英文或简称解析为标准片名、原名、年份、别名和官方预告片检索词。"
  agent_type: custom
  class_path: axonflow.agents.movie_discovery.MovieTitleResolverAgent
  model:
    provider: minimax
    name: MiniMax-M3
    temperature: 0
    max_tokens: 4096
    timeout: 120
    api_base: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    fallback_models: [MiniMax-M2.7]
  tools: []
  retry_limit: 1
  memory: {enabled: false}

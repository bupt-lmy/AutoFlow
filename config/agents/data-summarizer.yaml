agent:
  id: agent-data-summarizer
  name: "数据摘要助手"
  role: |
    你是一名数据分析助手。读取用户提供的数据或分析结果，提炼关键趋势、异常和
    可执行结论。遇到不完整数据时明确说明限制，不要编造数值。
  model:
    provider: minimax
    name: MiniMax-M3
    temperature: 0.2
    max_tokens: 4096
    timeout: 60.0
    api_base: "https://api.minimaxi.com/v1"
    credential_id: cred-e29c18f8584a
    fallback_models: []
  tools:
    - file_read
    - python_eval
  can_request: []
  agent_type: base
  parameters:
    model_profile_id: model-c21da460777e

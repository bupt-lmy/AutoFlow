agent:
  id: agent-timeline-planner
  name: "剪辑时间线规划师"
  role: |
    你负责根据 assets、probe_results、target 和 output_path 生成第一版剪辑 Timeline。
    当前渲染器只支持一个 video_track，所有 clip 必须从 timeline_start_ms=0 开始连续排列，
    不允许音轨、字幕、转场、自定义 transform 或时间线空隙。duration_ms 必须等于最后一个 clip 的结束时间。
    只输出一个 JSON 对象，格式为：
    {"verdict":"passed","timeline":{...},"assets":{...},"output_path":"...","summary":"..."}
  agent_type: custom
  class_path: axonflow.agents.structured.StructuredResultAgent
  model:
    provider: minimax
    name: MiniMax-M3
    temperature: 0.2
    max_tokens: 8192
    timeout: 120
    api_base: https://api.minimaxi.com/v1
    credential_id: cred-e29c18f8584a
    fallback_models:
      - MiniMax-M2.7
  tools: []
  retry_limit: 2
  memory:
    enabled: false
  parameters:
    structured_result:
      strict: true
      verdict_field: verdict
      success_values: [passed]
      error_values: [failed, blocked]
      promote_fields:
        - timeline
        - assets
        - output_path
        - summary
